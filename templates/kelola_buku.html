{% extends 'layout.html' %}
{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
  <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm h-fit">
    <h2 class="text-lg font-bold text-slate-800 mb-4">Tambah Buku Baru</h2>
    <form method="POST" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Judul Buku</label>
        <input type="text" name="judul" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Penulis</label>
        <input type="text" name="penulis" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Kategori</label>
        <input type="text" name="kategori" placeholder="Teknologi, Sastra, dll" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Jumlah Stok</label>
        <input type="number" name="stok" min="1" value="1" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
      </div>
      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg text-sm transition">Simpan Buku</button>
    </form>
  </div>

  <div class="lg:col-span-2">
    <h2 class="text-lg font-bold text-slate-800 mb-4">Inventaris Buku</h2>
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <table class="w-full text-left text-sm">
        <thead class="bg-slate-50 border-b border-slate-200 text-xs uppercase text-slate-500 font-semibold">
          <tr>
            <th class="py-3 px-4">Judul</th>
            <th class="py-3 px-4">Kategori</th>
            <th class="py-3 px-4 text-center">Tersedia</th>
            <th class="py-3 px-4 text-center">Aksi</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          {% for b in buku_list %}
          <tr class="hover:bg-slate-50/50">
            <td class="py-3 px-4">
              <p class="font-medium text-slate-800">{{ b.judul }}</p>
              <p class="text-xs text-slate-400">{{ b.penulis }}</p>
            </td>
            <td class="py-3 px-4 text-slate-600">{{ b.kategori }}</td>
            <td class="py-3 px-4 text-center font-bold text-slate-700">{{ b.stok_tersedia }} / {{ b.stok_total }}</td>
            <td class="py-3 px-4 text-center">
              <form action="{{ url_for('hapus_buku', buku_id=b.id) }}" method="POST" onsubmit="return confirm('Hapus buku ini dari database?');">
                <button type="submit" class="text-xs text-rose-600 hover:text-rose-800 font-semibold">Hapus</button>
              </form>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
