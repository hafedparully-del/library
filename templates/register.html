{% extends 'layout.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-emerald-100 mt-8">
  <h2 class="text-2xl font-bold text-slate-800 mb-2 text-center">Registrasi Anggota</h2>
  <p class="text-sm text-slate-500 text-center mb-6">Buat akun untuk mulai meminjam buku</p>

  <form method="POST" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nama Lengkap</label>
      <input type="text" name="nama" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Username</label>
      <input type="text" name="username" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
      <input type="password" name="password" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
    </div>
    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg transition duration-150">Daftar</button>
  </form>

  <p class="text-xs text-center text-slate-500 mt-6">
    Sudah memiliki akun? <a href="{{ url_for('login') }}" class="text-emerald-700 font-semibold hover:underline">Masuk</a>
  </p>
</div>
{% endblock %}
